{% extends 'base.html' %}
{% block title %}500 - System Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 fw-bold text-danger mb-3">500</div>
        <h2 class="fw-bold mb-2">Internal Server Error</h2>
        <p class="text-muted mb-4">An unexpected issue occurred while processing the request. Please contact administrator if this persists.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom px-4 py-2">
            <i class="bi bi-house-door me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
