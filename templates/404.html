{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 fw-bold text-primary mb-3">404</div>
        <h2 class="fw-bold mb-2">Resource Not Found</h2>
        <p class="text-muted mb-4">The requested asset, page, or record could not be located in AssetVault.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom px-4 py-2">
            <i class="bi bi-house-door me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
