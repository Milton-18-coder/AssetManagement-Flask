{% extends 'base.html' %}
{% block title %}Edit User - {{ user.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="{{ url_for('users.index') }}">Users</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('users.view', user_id=user.user_id) }}">{{ user.user_id }}</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit</li>
            </ol>
        </nav>
        <h1 class="page-title">Edit User Profile</h1>
        <p class="page-subtitle">{{ user.name }} ({{ user.user_id }})</p>
    </div>
    <div>
        <a href="{{ url_for('users.view', user_id=user.user_id) }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Cancel & View
        </a>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('users.edit', user_id=user.user_id) }}">
            <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                    <label class="form-label small fw-bold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label small fw-bold">Email Address <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold">Phone Number</label>
                    <input type="text" name="phone" class="form-control" value="{{ user.phone }}">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold">Department <span class="text-danger">*</span></label>
                    <select name="department" class="form-select" required>
                        {% for d in departments %}
                            <option value="{{ d.name }}" {% if user.department == d.name %}selected{% endif %}>{{ d.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold">Designation</label>
                    <input type="text" name="designation" class="form-control" value="{{ user.designation }}">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active" {% if user.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if user.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                <a href="{{ url_for('users.index') }}" class="btn btn-light border px-4">Cancel</a>
                <button type="submit" class="btn btn-primary-custom px-4">
                    <i class="bi bi-save me-1"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
