{% extends 'base.html' %}
{% block title %}Register User{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="{{ url_for('users.index') }}">Users</a></li>
                <li class="breadcrumb-item active" aria-current="page">New User</li>
            </ol>
        </nav>
        <h1 class="page-title">Register New User / Employee</h1>
        <p class="page-subtitle">Add personnel eligible for equipment checkouts and asset tracking</p>
    </div>
    <div>
        <a href="{{ url_for('users.index') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Users
        </a>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('users.add') }}">
            <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                    <label class="form-label small fw-bold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Dr. Jane Smith / Alex Taylor" value="{{ user.name or '' }}" required>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label small fw-bold">Email Address <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" placeholder="e.g. user@organization.edu" value="{{ user.email or '' }}" required>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold">Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="e.g. +91 98765 43210" value="{{ user.phone or '' }}">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold">Department <span class="text-danger">*</span></label>
                    <select name="department" class="form-select" required>
                        <option value="">Select Department...</option>
                        {% for d in departments %}
                            <option value="{{ d.name }}" {% if user.department == d.name %}selected{% endif %}>{{ d.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold">Designation</label>
                    <input type="text" name="designation" class="form-control" placeholder="e.g. Professor / Lead Developer / Student" value="{{ user.designation or '' }}">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active" {% if (user.status or 'Active') == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if user.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                <a href="{{ url_for('users.index') }}" class="btn btn-light border px-4">Cancel</a>
                <button type="submit" class="btn btn-primary-custom px-4">
                    <i class="bi bi-person-check me-1"></i> Register User
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
